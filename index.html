<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Consultas e Exames</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Agenda de Consultas e Exames</h1>
    <form id="form-agendamento">
    <label for="nome-paciente">Nome do paciente:</label>
    <input type="text" id="nome-paciente" name="nome-paciente" placeholder="Ex: Maria da Silva" required>
    <label for="data-agendamento">Data:</label>
    <input type="date" id="data-agendamento" name="data-agendamento" required>

    <label for="tipo-agendamento">Tipo:</label>
    <select id="tipo-agendamento" name="tipo-agendamento" required>
        <option value="">Selecione</option>
        <option value="consulta">Consulta</option>
        <option value="exame">Exame</option>
    </select>

    <label for="medico">Médico:</label>
    <input type="text" id="medico" name="medico" placeholder="Ex: Dr. João Souza" required>

    <button type="submit">Agendar</button>
   </form>
   <h2>Agendamentos marcados</h2>
<ul id="lista-agendamentos">
</ul>
<footer>
    <p>Projeto de estudo: Agenda de Consultas e Exames</p>
</footer>
<script src="script.js"></script>
</body>
</html>
